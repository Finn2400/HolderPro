name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: python packaging/scripts/validate_schema.py
      - run: python packaging/scripts/check_licenses.py
      - run: reuse lint
      - run: python packaging/scripts/verify_source_manifest.py

  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  metadata:
    name: Validate Python package metadata (not a release wheel)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: rm -rf build dist
      - run: python -m build --wheel
      - name: Reject source distributions and identify the metadata-only wheel
        run: |
          test -z "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          test "$(find dist -maxdepth 1 -type f -name '*-py3-none-any.whl' | wc -l)" -eq 1
          python -m zipfile -l dist/*.whl
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*-py3-none-any.whl"))
          with zipfile.ZipFile(wheel) as archive:
              leaked = sorted(
                  name
                  for name in archive.namelist()
                  if name.startswith("holderpro/_native/")
                  and name != "holderpro/_native/__init__.py"
              )
          if leaked:
              raise SystemExit(
                  "metadata-only wheel unexpectedly contains native payload: "
                  + ", ".join(leaked)
              )
          PY
